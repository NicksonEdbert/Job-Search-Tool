name: Daily internship refresh

on:
  schedule:
    - cron: "17 22 * * *" # 05:17 in Jakarta (WIB, UTC+7), so the alert is waiting in the morning
  workflow_dispatch:
    inputs:
      send_alert:
        description: "Send the Telegram/email alert"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ["tracker/**", "config/**", "jobsearch/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Latest commit on the branch, not the one that triggered the run, so re-runs work.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover tests

      - name: Fetch internships
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERTS_IMAP_USER: ${{ secrets.ALERTS_IMAP_USER }}
          ALERTS_IMAP_PASSWORD: ${{ secrets.ALERTS_IMAP_PASSWORD }}
          TRACKER_URL: ${{ vars.TRACKER_URL }}
        run: python -m jobsearch --check-links ${{ (github.event_name == 'schedule' || inputs.send_alert) && '--send-alert' || '' }}

      - name: Save updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update internship listings"
          # If main moved meanwhile, replay on top of it; this run's fresh data wins any clash.
          git push || (git pull --rebase -X theirs && git push)

      - name: Build tracker site
        run: |
          mkdir -p _site/config
          cp -r tracker data _site/
          rm -f _site/data/history.json
          cp config/experience.json config/opportunities.json _site/config/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=tracker/"><title>Internship Finder</title><a href="tracker/">Open the tracker</a>\n' > _site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    # Separate job so the listings still update even before GitHub Pages is turned on.
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
