name: Discovery probe (temporary)

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/**", ".github/workflows/probe.yml", "jobsearch/**", "config/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Full run (no commit, no alert)
        run: python -m unittest discover tests && python -m jobsearch --out /tmp/out --top 80
