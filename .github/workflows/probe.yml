name: Discovery probe (temporary)

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/**", ".github/workflows/probe.yml", "jobsearch/**", "config/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover tests
      - name: Check every Opportunities / Experience link
        run: |
          python - <<'PY'
          import json, concurrent.futures as cf
          from jobsearch.http import link_status
          items = json.load(open("config/opportunities.json"))["items"] + json.load(open("config/experience.json"))["items"]
          urls = [i["url"] for i in items if i.get("url")]
          with cf.ThreadPoolExecutor(8) as ex:
              for u, st in zip(urls, ex.map(link_status, urls)):
                  print(f"{st:8} {u}")
          PY
      - name: Full run (no commit, no alert)
        run: python -m jobsearch --out /tmp/out --top 70
