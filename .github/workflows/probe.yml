name: Discovery probe (temporary)

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/**", ".github/workflows/probe.yml", "jobsearch/**", "config/**"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Discover career boards
        run: python tools/discover.py --file tools/candidates.json
      - name: Full run (no commit, no alert)
        run: python -m jobsearch --out /tmp/out --top 60
